name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Check release version
        if: github.event_name == 'push'
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Install ripgrep for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - run: bun run build:all
      - run: bun test script/openai.integration.test.ts script/ota.test.ts
      - name: Stage release assets
        run: |
          mkdir release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            ext=''
            if [[ "$target" == windows-* ]]; then ext='.exe'; fi
            cp "dist/$target/xcode$ext" "release/xcode-$target$ext"
          done
          jq '.targets |= with_entries(.value.file |= ("xcode-" + sub("/xcode"; "")))' dist/manifest.json > release/manifest.json
          jq -r '.targets[] | "\(.sha256)  \(.file)"' release/manifest.json > release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          cp script/install.sh script/install.ps1 release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcode-release
          path: release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: xcode-release
          path: release/
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Sign OTA manifest
        env:
          XCODE_OTA_SIGNING_KEY: ${{ secrets.XCODE_OTA_SIGNING_KEY }}
        run: bun script/sign-ota.ts release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" release/*
